services:
  # ─────────────────────────────────────────────
  # PostgreSQL 17 / OfflineDB AI
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # pgAdmin 4
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: app_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      ALLOWED_LLM_API_URLS: "[\"http://ollama:11434\", \"http://localhost:11434\"]"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Ollama — servidor LLM
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # Model Loader — descarga el modelo una sola vez
  # Se detiene solo al terminar (restart: "no")
  # ─────────────────────────────────────────────
  model-loader:
    image: curlimages/curl:latest
    container_name: ollama_model_loader
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo '>>> Descargando qwen2.5-coder:3b...' &&
        curl -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{"name": "qwen2.5-coder:3b"}' \
          --no-buffer &&
        echo '>>> Modelo listo.'

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:

